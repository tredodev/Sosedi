# Сборка приложения в один файл и публикация прототипа на GitLab Pages.
stages: [build, deploy]

build:
  stage: build
  image: node:20-alpine
  script:
    - node build.mjs
  artifacts:
    paths: [dist/]
    expire_in: 30 days

pages:
  stage: deploy
  image: node:20-alpine
  needs: [build]
  script:
    - mkdir -p public/app
    - cp prototype/index.html public/index.html
    - cp dist/index.html public/app/index.html
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
